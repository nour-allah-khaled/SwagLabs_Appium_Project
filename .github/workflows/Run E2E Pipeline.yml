name: Appium E2E

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
env:
  executionType: ci
  appiumServerUrl: http://127.0.0.1:4723

jobs:
  E2E_Appium_Android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Appium
        run: |
          npm install -g appium
          appium driver install uiautomator2

      - name: Run E2E tests on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          disable-animations: false
          emulator-options: >-
            -no-window
            -no-audio
            -no-boot-anim
            -gpu swiftshader_indirect
          script: |
            npm install -g wait-on
            appium --log-level error &
            echo "Waiting for Appium to be ready..."
            wait-on http://127.0.0.1:4723/wd/hub/status
            adb wait-for-device
            adb devices
            mvn clean test -Dtest=E2E -DexecutionType=${{ env.executionType }} -DappiumServerUrl=${{ env.appiumServerUrl }}

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-reports
          path: Test-out/allure-results
