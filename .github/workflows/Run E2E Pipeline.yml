name: Appium E2E

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  executionType: ci
  appiumServerUrl: http://127.0.0.1:4723

jobs:
  E2E_Appium_Android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Appium
        run: |
          npm install -g appium wait-on
          appium driver install uiautomator2

      - name: Start Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          disable-animations: false
          emulator-options: >-
            -no-window
            -no-audio
            -no-boot-anim
            -gpu swiftshader_indirect

      - name: Start Appium and Run E2E Tests
        run: |
          echo "Starting Appium server..."
          appium -a 0.0.0.0 -p 4723 --log-level error > appium.log 2>&1 &
          echo "Waiting for Appium server to be ready..."
          wait-on --timeout 60000 http://127.0.0.1:4723/wd/hub/status
          
          echo "Waiting for emulator to be ready..."
          adb wait-for-device
          adb devices
          
          echo "Running Maven tests..."
          mvn clean test -Dtest=E2E -DexecutionType=${{ env.executionType }} -DappiumServerUrl=${{ env.appiumServerUrl }}

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-reports
          path: Test-out/allure-results
