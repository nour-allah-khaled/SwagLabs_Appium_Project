name: E2E
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  Appium_Android:
    runs-on: ubuntu-latest
    permissions:
      checks: write
    env:
      ANDROID_DEVICE_NAME: TestEmulatorApp
      ANDROID_PLATFORM_VERSION: 11.0
      ANDROID_APP_PATH: src/test/java/resources/Android.SauceLabs.Mobile.Sample.app.2.7.1.apk
      ANDROID_APP_PACKAGE: com.swaglabsmobileapp
      ANDROID_APP_ACTIVITY: com.swaglabsmobileapp.MainActivity
      ANDROID_AUTOMATION_NAME: UiAutomator2

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Maven
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.9.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Appium
        uses: FinbertMDS/setup-appium@latest

      - name: Run tests with Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86
          emulator-options: >-
            -no-window
            -no-audio
            -no-boot-anim
            -no-snapshot-load
            -wipe-data
            -gpu swiftshader_indirect
          disable-animations: true
          script: |
            echo "Starting Appium server..."
            npx appium &
            sleep 20
            echo "Waiting for Appium to be ready..."
            timeout 60 bash -c 'until curl -s http://127.0.0.1:4723/status | grep -q "value"; do sleep 2; done' || echo "Appium check skipped"
            echo "Running E2E tests..."
            mvn -Dtest="E2E" clean test || TEST_EXIT=$?
            exit ${TEST_EXIT:-0}
        continue-on-error: true

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Appium_AndroidReport
          path: "Test-out/allure-results"